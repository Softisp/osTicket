apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db
  labels: {{- include "helpdesk.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: {{ .Release.Name }}-db, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: mysql, port: 3306}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
  labels: {{- include "helpdesk.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-db, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}-db, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports: [{containerPort: 3306, name: mysql}]
          env:
            - {name: MARIADB_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db, key: root-password}}}
            - {name: MARIADB_DATABASE, value: {{ .Values.mariadb.database }}}
            - {name: MARIADB_USER, value: {{ .Values.mariadb.user }}}
            - {name: MARIADB_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db, key: password}}}
          readinessProbe:
            exec: {command: ["healthcheck.sh", "--connect", "--innodb_initialized"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.mariadb.storageClass }}
        resources: {requests: {storage: {{ .Values.mariadb.size }}}}
